# PLAN-dictionary-backed-formats DF3 (a): the variable -> dictionary level table of the format path.
#
# Rows:
#   <type>.suffix.<SUFFIX>=<LEVEL>   a column named <two-character domain prefix><SUFFIX>, e.g.
#                                    AEDECOD -> meddra PT; matched case-insensitively, the longest
#                                    suffix first (AEHLGTCD is HLGTCD, never HLGT)
#   <type>.name.<NAME>=<LEVEL>       an explicit full column name (PESTRESC -> meddra PT)
#   <type>.default=<LEVEL>           the level of EVERY column bound to a single-level type (DF22:
#                                    LOINC's only level is its code level)
# A column that matches no row has no level: the column stays metadata-only with a status, never
# "every value unmapped" and never a guessed level (DF22 (b)/(c) rejected).
#
# Seeded from the rule corpus's own (variable, dictionary_term_type) pairs (84 calls at
# cumba-corej-rules fbc75cb5, plan §2.3) plus loinc=LOINC. --BODSYS / --BDSYCD are membership rows
# here (the corpus checks them as SOC / SOCCD); the engine excludes --BODSYS only from its
# HIERARCHY mapping, a different concern. TSVAL / TSVALCD are row-dependent (non-goal): no row.
#
# ⚠ A row's SUFFIX follows exactly two characters: the domain prefix. Longest-first ordering is by
# the suffix's length.

meddra.suffix.LLT=LLT
meddra.suffix.LLTCD=LLTCD
meddra.suffix.DECOD=PT
meddra.suffix.PTCD=PTCD
meddra.suffix.HLT=HLT
meddra.suffix.HLTCD=HLTCD
meddra.suffix.HLGT=HLGT
meddra.suffix.HLGTCD=HLGTCD
meddra.suffix.SOC=SOC
meddra.suffix.SOCCD=SOCCD
meddra.suffix.BODSYS=SOC
meddra.suffix.BDSYCD=SOCCD
meddra.name.PESTRESC=PT

whodrug.suffix.DECOD=PT
whodrug.suffix.CLAS=ATC
whodrug.suffix.CLASCD=ATCCD

loinc.suffix.LOINC=LOINC
loinc.default=LOINC
